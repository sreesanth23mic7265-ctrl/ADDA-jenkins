<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f5f4ef">
	<title>Daylight — your daily list</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #252820;
			background: #f5f4ef;
			font-synthesis: none;
			text-rendering: optimizeLegibility;
			-webkit-font-smoothing: antialiased;
			--muted: #77796f;
			--line: #e8e6dd;
			--green: #587456;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			padding: 48px 20px;
			background:
				radial-gradient(ellipse at 50% 0%, #e8eadf 0, transparent 42%),
				#f5f4ef;
		}

		main {
			width: min(100%, 620px);
			margin: 0 auto;
		}

		.eyebrow {
			margin: 0 0 10px;
			color: var(--green);
			font-size: 12px;
			font-weight: 750;
			letter-spacing: .16em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(42px, 8vw, 62px);
			font-weight: 400;
			letter-spacing: -.055em;
			line-height: 1;
		}

		.intro {
			margin: 14px 0 30px;
			color: var(--muted);
			font-size: 15px;
			line-height: 1.6;
		}

		.card {
			overflow: hidden;
			border: 1px solid #e8e6dd;
			border-radius: 18px;
			background: rgba(255, 255, 255, .86);
			box-shadow: 0 18px 55px rgba(49, 51, 40, .07);
		}

		form {
			display: flex;
			gap: 10px;
			padding: 20px;
			border-bottom: 1px solid var(--line);
		}

		input {
			min-width: 0;
			flex: 1;
			padding: 13px 15px;
			border: 1px solid var(--line);
			border-radius: 10px;
			outline: none;
			background: #fbfbf9;
			color: inherit;
			font: inherit;
		}

		input:focus { border-color: #9baa95; box-shadow: 0 0 0 3px #5874561c; }

		button { font: inherit; }

		.add-button {
			padding: 0 18px;
			border: 0;
			border-radius: 10px;
			background: #587456;
			color: white;
			font-size: 14px;
			font-weight: 650;
			cursor: pointer;
			transition: background .15s, transform .15s;
		}

		.add-button:hover { background: #456343; }
		.add-button:active { transform: scale(.97); }

		.list-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 16px 20px 10px;
		}

		#task-count {
			color: var(--muted);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: .08em;
			text-transform: uppercase;
		}

		.filters { display: flex; gap: 4px; }

		.filter {
			padding: 7px 10px;
			border: 0;
			border-radius: 7px;
			background: transparent;
			color: var(--muted);
			font-size: 12px;
			cursor: pointer;
		}

		.filter:hover { background: #f4f4ef; }
		.filter[aria-pressed="true"] { background: #edf1e9; color: #456343; font-weight: 700; }

		#task-list {
			min-height: 178px;
			margin: 0;
			padding: 0 20px;
			list-style: none;
		}

		.task {
			display: flex;
			align-items: center;
			gap: 12px;
			min-height: 57px;
			border-bottom: 1px solid #f0efe9;
		}

		.task-check {
			display: grid;
			width: 21px;
			height: 21px;
			flex: 0 0 21px;
			place-items: center;
			padding: 0;
			border: 1.5px solid #c9cbbf;
			border-radius: 50%;
			background: white;
			color: white;
			cursor: pointer;
		}

		.task-check:hover { border-color: var(--green); }
		.task.done .task-check { border-color: var(--green); background: var(--green); }
		.task.done .task-check::after { content: "✓"; font-size: 13px; }

		.task-title {
			min-width: 0;
			flex: 1;
			overflow-wrap: anywhere;
			font-size: 14px;
			line-height: 1.45;
		}

		.task.done .task-title { color: #999b91; text-decoration: line-through; }

		.delete-button {
			width: 32px;
			height: 32px;
			border: 0;
			border-radius: 8px;
			background: transparent;
			color: #999b91;
			font-size: 19px;
			cursor: pointer;
			opacity: 0;
		}

		.task:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
		.delete-button:hover { background: #f7eeea; color: #a44c3c; }

		.empty-state {
			display: grid;
			min-height: 178px;
			place-content: center;
			gap: 6px;
			text-align: center;
		}

		.empty-state strong { font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 400; }
		.empty-state span { color: var(--muted); font-size: 13px; }

		.card-footer {
			display: flex;
			align-items: center;
			justify-content: space-between;
			min-height: 54px;
			padding: 10px 20px;
			border-top: 1px solid var(--line);
			color: var(--muted);
			font-size: 12px;
		}

		#clear-completed {
			padding: 6px 0 6px 8px;
			border: 0;
			background: transparent;
			color: var(--muted);
			font-size: 12px;
			cursor: pointer;
		}

		#clear-completed:hover { color: #a44c3c; }
		#storage-status { min-height: 20px; margin: 12px 2px 0; color: #a44c3c; font-size: 12px; }

		@media (max-width: 480px) {
			body { padding: 34px 14px; }
			form { padding: 15px; }
			.list-header { padding-right: 15px; padding-left: 15px; }
			#task-list { padding: 0 15px; }
			.card-footer { padding-right: 15px; padding-left: 15px; }
			.delete-button { opacity: 1; }
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">A little more focus</p>
		<h1>Make room<br>for today.</h1>
		<p class="intro">A calm place for the things you want to get done.<br>One step at a time.</p>

		<section class="card" aria-label="Daily task list">
			<form id="task-form">
				<label for="task-input" hidden>Add a task</label>
				<input id="task-input" name="task" type="text" maxlength="120" placeholder="What needs doing?" autocomplete="off" required>
				<button class="add-button" type="submit">Add task</button>
			</form>
			<div class="list-header">
				<span id="task-count" aria-live="polite">0 tasks left</span>
				<nav class="filters" aria-label="Filter tasks">
					<button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
					<button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
					<button class="filter" type="button" data-filter="completed" aria-pressed="false">Done</button>
				</nav>
			</div>
			<ul id="task-list" aria-label="Tasks"></ul>
			<div class="card-footer">
				<span id="task-summary">Your list is ready when you are.</span>
				<button id="clear-completed" type="button">Clear completed</button>
			</div>
		</section>
		<p id="storage-status" role="status" aria-live="polite"></p>
	</main>
	<script>
		const STORAGE_KEY = "daylight-tasks";
		const form = document.querySelector("#task-form");
		const input = document.querySelector("#task-input");
		const list = document.querySelector("#task-list");
		const count = document.querySelector("#task-count");
		const summary = document.querySelector("#task-summary");
		const status = document.querySelector("#storage-status");
		let filter = "all";
		let tasks = [];

		function saveTasks() {
			try {
				localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
				status.textContent = "";
			} catch (error) {
				status.textContent = "Your changes could not be saved in this browser.";
				console.error("Could not save tasks to local storage.", error);
			}
		}

		function renderTasks() {
			const remaining = tasks.filter(task => !task.completed).length;
			count.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
			summary.textContent = tasks.length === 0
				? "Your list is ready when you are."
				: `${tasks.length - remaining} completed`;

			list.replaceChildren();
			const visibleTasks = tasks.filter(task =>
				filter === "all" ||
				(filter === "active" && !task.completed) ||
				(filter === "completed" && task.completed)
			);

			if (visibleTasks.length === 0) {
				const empty = document.createElement("li");
				empty.className = "empty-state";
				const message = document.createElement("strong");
				const detail = document.createElement("span");
				if (tasks.length === 0) {
					message.textContent = "A fresh start.";
					detail.textContent = "Add a task above to get going.";
				} else if (filter === "active") {
					message.textContent = "All caught up.";
					detail.textContent = "There are no active tasks.";
				} else {
					message.textContent = "Nothing here yet.";
					detail.textContent = "Completed tasks will show up here.";
				}
				empty.append(message, detail);
				list.append(empty);
			}

			for (const task of visibleTasks) {
				const item = document.createElement("li");
				item.className = task.completed ? "task done" : "task";

				const toggle = document.createElement("button");
				toggle.className = "task-check";
				toggle.type = "button";
				toggle.setAttribute("aria-label", `${task.completed ? "Mark as active" : "Complete"}: ${task.title}`);
				toggle.setAttribute("aria-pressed", String(task.completed));
				toggle.addEventListener("click", () => {
					task.completed = !task.completed;
					saveTasks();
					renderTasks();
				});

				const title = document.createElement("span");
				title.className = "task-title";
				title.textContent = task.title;

				const remove = document.createElement("button");
				remove.className = "delete-button";
				remove.type = "button";
				remove.textContent = "×";
				remove.setAttribute("aria-label", `Delete: ${task.title}`);
				remove.addEventListener("click", () => {
					tasks = tasks.filter(candidate => candidate.id !== task.id);
					saveTasks();
					renderTasks();
				});

				item.append(toggle, title, remove);
				list.append(item);
			}
		}

		try {
			const savedTasks = localStorage.getItem(STORAGE_KEY);
			if (savedTasks !== null) {
				const parsedTasks = JSON.parse(savedTasks);
				if (!Array.isArray(parsedTasks) || !parsedTasks.every(task =>
					task && typeof task.id === "string" &&
					typeof task.title === "string" &&
					typeof task.completed === "boolean"
				)) {
					throw new Error("Saved task data has an invalid format.");
				}
				tasks = parsedTasks;
			}
		} catch (error) {
			status.textContent = "Saved tasks could not be loaded. Your new tasks will still work.";
			console.error("Could not load tasks from local storage.", error);
		}

		form.addEventListener("submit", event => {
			event.preventDefault();
			const title = input.value.trim();
			if (!title) return;
			tasks.unshift({ id: crypto.randomUUID(), title, completed: false });
			saveTasks();
			renderTasks();
			form.reset();
			input.focus();
		});

		document.querySelectorAll(".filter").forEach(button => {
			button.addEventListener("click", () => {
				filter = button.dataset.filter;
				document.querySelectorAll(".filter").forEach(filterButton =>
					filterButton.setAttribute("aria-pressed", String(filterButton === button))
				);
				renderTasks();
			});
		});

		document.querySelector("#clear-completed").addEventListener("click", () => {
			tasks = tasks.filter(task => !task.completed);
			saveTasks();
			renderTasks();
		});

		renderTasks();
	</script>
</body>
</html>
